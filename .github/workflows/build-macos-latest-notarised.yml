name: Build and Test Notarized MacOS Executable

on:
  push:
    branches:
      - release-notarise

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-and-build
        with:
          os: macos-latest
          artifact-name: macos-latest-release
          should-upload: "false"

      - name: Import Developer ID Cert
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euxo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "$MACOS_CERT_P12" | base64 -D > cert.p12
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security import cert.p12 -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_PASSWORD" -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Codesign
        run: |
          set -euxo pipefail
          TARGET="dist/PALMS.app"
          codesign --deep --force --options runtime --sign "Developer ID Application" "$TARGET"
          codesign --verify --deep --strict "$TARGET"

      - name: Zip for notarization
        run: |
          set -euxo pipefail
          TARGET="dist/PALMS.app"
          ditto -c -k --keepParent "$TARGET" release_macos_candidate.zip

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euxo pipefail
          xcrun notarytool submit release_macos_candidate.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Staple ticket
        run: |
          set -euxo pipefail
          TARGET="dist/PALMS.app"
          xcrun stapler staple "$TARGET"
          spctl --assess --type execute -vv "$TARGET"

      - name: Delete candidate zip, re-create notarised one.
        run: |
          set -euxo pipefail
          rm release_macos_candidate.zip
          mkdir -p release
          ls -R dist/
          ditto -c -k --keepParent dist/* release/release_macos_notarized.zip

      - name: Create or update "latest" tag
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin latest --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact to Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          files: release/release_macos_notarized.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
