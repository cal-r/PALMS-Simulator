name: Apple certificate P12

on:
  workflow_dispatch:

jobs:
  p12:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .p12 from .cer + key
        env:
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euxo pipefail
          ls -lah .apple/

          # Convert Apple's DER .cer to PEM
          openssl x509 -in .apple/developerID.cer -inform DER -out .apple/developerID.pem

          # Create p12
          openssl pkcs12 -export \
            -inkey .apple/dev.key \
            -in .apple/developerID.pem \
            -out .apple/developerID.p12 \
            -passout env:P12_PASSWORD

          # Emit base64 for pasting into GitHub secret MACOS_CERT_P12
          base64 -i .apple/developerID.p12 > .apple/developerID.p12.b64

          ls -lah .apple/

      - name: Upload p12 artifact
        uses: actions/upload-artifact@v4
        with:
          name: developerid-p12
          path: .apple/developerID.p12
          retention-days: 3

      - name: Upload p12 base64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: developerid-p12
          path: .apple/developerID.p12.b64
          retention-days: 3
