name: Apple certificate P12

on:
  workflow_dispatch:

jobs:
  p12:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .p12 from .cer + key
        env:
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euxo pipefail
          ls -lah .apple/

          openssl x509 -in .apple/developerID_application.cer -inform DER -out .apple/developerID_application.pem

          openssl pkcs12 -export \
            -inkey .apple/dev.key \
            -in .apple/developerID_application.pem \
            -out .apple/developerID_application.p12 \
            -passout env:P12_PASSWORD

          # Emit base64 for pasting into GitHub secret MACOS_CERT_P12
          base64 -i .apple/developerID_application.p12 > .apple/developerID_application.p12.b64

          ls -lah .apple/

      - name: Upload p12 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: developerID
          path: |
            .apple/developerID_application.p12
            .apple/developerID_application.p12.b64
          retention-days: 3
